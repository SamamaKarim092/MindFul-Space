name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 05:00 UTC to prevent Supabase free tier 7-day auto-pause
    - cron: '0 5 */3 * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Supabase Database & REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL || 'https://tlskpfihsjghjoffzoii.supabase.co' }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsc2twZmloc2pnaGpvZmZ6b2lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0NjEyMDYsImV4cCI6MjA4MTAzNzIwNn0.E8Iop--AGlQoMdPbUzT1nkQ9f8K_gWht8w05M9fely8' }}"

          echo "Pinging Supabase REST API at: $SUPABASE_URL/rest/v1/"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/")

          echo "Supabase REST API HTTP Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 404 ] || [ "$HTTP_STATUS" -eq 401 ]; then
            echo "✅ Supabase project pinged successfully! Auto-pause timer has been reset."
          else
            echo "⚠️ Unexpected status $HTTP_STATUS, but request reached Supabase gateway."
          fi

      - name: Ping Supabase Auth Endpoint
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL || 'https://tlskpfihsjghjoffzoii.supabase.co' }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsc2twZmloc2pnaGpvZmZ6b2lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0NjEyMDYsImV4cCI6MjA4MTAzNzIwNn0.E8Iop--AGlQoMdPbUzT1nkQ9f8K_gWht8w05M9fely8' }}"

          echo "Pinging Supabase Auth Health..."
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/auth/v1/health")

          echo "Supabase Auth HTTP Response Status: $AUTH_STATUS"
          echo "✅ Keep-alive check completed successfully."
